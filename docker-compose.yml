# Local development database only. The API and frontend run directly on your machine (see README).
services:
  db:
    image: postgres:16
    container_name: sitewatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sitewatch
      POSTGRES_PASSWORD: sitewatch
      POSTGRES_DB: sitewatch
    ports:
      - "5432:5432"
    volumes:
      - sitewatch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitewatch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sitewatch-pgdata:
