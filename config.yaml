# SiteRadar platform config. Secrets and per-environment values come from environment variables (see .env.example).
public_url: https://api.monitor.upplauseconsulting.com     # where this API is reachable (tracking script, logo URLs)

data_dir: data
database_url: ${DATABASE_URL}     # Railway Postgres

# Defaults used by the scheduler. Check frequency per customer comes from their plan.
failures_before_alert: 2
timeout_seconds: 15
slow_threshold_ms: 3000
ssl_warning_days: 21

audit:
  max_pages: 50
  daily_at: "03:00"

report:
  day_of_month: 1
  at: "07:00"

pagespeed_api_key: ${PAGESPEED_API_KEY}

health:
  daily_at: "03:30"              # domain expiry, DNS and sitemap checks
