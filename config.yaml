# SiteWatch production config. Secrets come from Railway environment variables.
public_url: https://api.monitor.upplauseconsulting.com

dashboard_password: ${SITEWATCH_PASSWORD}
data_dir: data
database_url: ${DATABASE_URL}     # Railway Postgres

check_interval_minutes: 5
failures_before_alert: 2
timeout_seconds: 15
slow_threshold_ms: 3000
ssl_warning_days: 21

audit:
  max_pages: 50
  daily_at: "03:00"

report:
  day_of_month: 1
  at: "07:00"

pagespeed_api_key: ${PAGESPEED_API_KEY}

health:
  daily_at: "03:30"              # domain expiry, DNS and sitemap checks

alerts:
  email_to:
    - jeremiahmills93@gmail.com
    - salomey.gyamfi@upplauseconsulting.com
    - saviour.avornyo@upplauseconsulting.com
  email:
    host: smtp.gmail.com
    port: 587
    username: jeremiahmills93@gmail.com
    password: ${SMTP_PASSWORD}
    from: "SiteWatch <jeremiahmills93@gmail.com>"

