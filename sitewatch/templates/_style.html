<style>
:root{
  --bg:#fff7ed; --card:#ffffff; --ink:#0f172a; --muted:#68716d; --line:#e4e2db;
  --accent:#c2410c; --accent-soft:#ffedd5;
  --ok:#2f8f5b; --ok-soft:#e5f3ea; --warn:#c98a12; --warn-soft:#fbf1dc; --bad:#c4402f; --bad-soft:#fbe7e3;
  --nodata:#dddbd3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:19px;letter-spacing:-.01em;margin:36px 0 12px;display:flex;align-items:center;gap:10px}
h2 .n{font:600 12px/1 "Geist Mono",ui-monospace,Menlo,monospace;color:var(--accent);background:var(--accent-soft);padding:5px 7px;border-radius:6px}
h3{font-size:15px;margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:760px){.g2{grid-template-columns:1fr}}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;margin-top:2px}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.trunc{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-high,.p-1{background:var(--bad-soft);color:var(--bad)}
.p-medium,.p-2{background:var(--warn-soft);color:#93650c}
.p-low,.p-3{background:#eceae4;color:var(--muted)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.bar-row{display:grid;grid-template-columns:130px 1fr 40px;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.track{height:9px;background:#eceae4;border-radius:9px;overflow:hidden}
.track i{display:block;height:100%;border-radius:9px}
.score{display:inline-grid;place-items:center;width:74px;height:74px;border-radius:50%;font-size:26px;font-weight:700;border:6px solid}
.s-good{color:var(--ok);border-color:var(--ok-soft)} .s-mid{color:var(--warn);border-color:var(--warn-soft)} .s-bad{color:var(--bad);border-color:var(--bad-soft)}
.bg-good{background:var(--ok)} .bg-mid{background:var(--warn)} .bg-bad{background:var(--bad)}
.rec{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .num{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px}
.rec .t{font-weight:600}
.rec .meta{font-size:12px;color:var(--muted);margin-left:6px}
.rec .why{color:var(--muted);font-size:14px;margin-top:2px}
.rec .act{font-size:14px;margin-top:4px}
.rec .act b{font-weight:600}
code{font:12.5px ui-monospace,Menlo,monospace;background:#efede7;padding:1px 5px;border-radius:5px;word-break:break-all}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary .c{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.issue-body{padding:8px 0 4px 2px;font-size:14px}
.issue-body ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.issue-body li{word-break:break-all}
svg.chart{width:100%;height:auto;display:block}
svg.strip{width:100%;height:34px;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ylab{font-size:10px;fill:var(--muted);text-anchor:end}
.chart .xlab{font-size:10px;fill:var(--muted);text-anchor:middle}
.chart .bar{fill:var(--accent)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2}
.chart .area{fill:var(--accent);opacity:.08}
.chart .dot{fill:var(--accent)}
.u-up{fill:var(--ok)} .u-warn{fill:var(--warn)} .u-down{fill:var(--bad)} .u-nodata{fill:var(--nodata)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.dot-status{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.banner{background:var(--warn-soft);border:1px solid #efd9a6;color:#7a560c;padding:10px 14px;border-radius:10px;font-size:14px;margin-top:14px}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:8px 14px;border-radius:9px;font-size:14px;font-weight:600;border:0;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
@media (max-width:600px){.wrap{padding:18px 14px 40px}.bar-row{grid-template-columns:100px 1fr 34px}.trunc{max-width:180px}h1{font-size:23px}}
form{margin:0}
@media print{body{background:#fff;font-size:12px}.wrap{padding:0;max-width:none}.kpi,.rec,.bar-row,tr{break-inside:avoid}.g2 .card{break-inside:avoid}.g2{grid-template-columns:1fr 1fr!important}.kpis{grid-template-columns:repeat(6,1fr)}.kpi .v{font-size:20px}.card{padding:14px 16px}h2{break-after:avoid;margin-top:24px}.noprint{display:none}details{break-inside:avoid}details>.issue-body{display:block}}
</style>
